[workspace]
resolver = "3"
members = [
	"led/blinker",
	"led/fade",
]

[workspace.dependencies]
cortex-m-rt = "0.7.7"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = {version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "rp2040", "time-driver", "critical-section-impl"] }
embassy-time = { version = "0.5.1", features =  ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
